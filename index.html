<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport must be set before any inline breakpoint/preload logic. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- First-view hero/catalog artwork (also NFT #1); preload before JS to improve mobile LCP. -->
    <link rel="preload" as="image" href="/assets/nfts/emerald-ape.webp" type="image/webp" fetchpriority="high" />
    <!-- Browser-discovered mobile catalog artwork. The media query prevents
         unnecessary loading on desktop, and avoids inline startup logic. -->
    <link rel="preload" as="image" href="/assets/nfts/sage-nomad.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high" />
    <meta name="description" content="Marketplace demonstrativo de NFTs com compras simuladas." />
    <title>NFT Marketplace | Frontend Challenge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mocks/earlyStart.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
