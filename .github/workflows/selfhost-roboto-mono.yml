name: Self-host the Figma Roboto Mono font

on:
  push:
    branches: [feat/figma-kurio-ui]
    paths:
      - '.github/workflows/selfhost-roboto-mono.yml'

permissions:
  contents: write

jobs:
  install-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add the locally hosted variable font
        run: |
          npm install --save @fontsource-variable/roboto-mono
          npm uninstall --save @fontsource-variable/geist
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/index.css')
          css = path.read_text(encoding='utf-8')
          original = "@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap');"
          old_geist = '@import "@fontsource-variable/geist";'
          assert original in css and old_geist in css, 'Expected font imports changed'
          css = css.replace(original, '@import "@fontsource-variable/roboto-mono";')
          css = css.replace(old_geist + '\n', '')
          css = css.replace("'Roboto Mono'", "'Roboto Mono Variable'")
          path.write_text(css, encoding='utf-8')
          PY
      - name: Verify clean install, TypeScript, lint and production build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit dependency lockfile and typography together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/index.css
          if ! git diff --cached --quiet; then
            git commit -m 'perf(fonts): host Roboto Mono locally without changing the design'
            git push origin HEAD:feat/figma-kurio-ui
          fi
