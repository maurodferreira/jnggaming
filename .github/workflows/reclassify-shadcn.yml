name: Reclassify shadcn CLI dependency
on:
  push:
    branches: [feat/figma-kurio-ui]
    paths:
      - '.github/workflows/reclassify-shadcn.yml'
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Move CLI-only shadcn to development and regenerate npm lock
        run: |
          npm pkg delete dependencies.shadcn
          npm pkg set 'devDependencies.shadcn=^4.22.1'
          npm install --package-lock-only --ignore-scripts
      - name: Verify the generated lockfile
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit reviewed dependency classification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): treat shadcn CLI as a development dependency'
            git push origin HEAD:feat/figma-kurio-ui
          fi
