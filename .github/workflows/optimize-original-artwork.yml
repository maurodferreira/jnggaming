name: Optimize the original KURIO artwork
on:
  push:
    branches: [feat/figma-kurio-ui]
    paths:
      - '.github/workflows/optimize-original-artwork.yml'

permissions:
  contents: write

jobs:
  export-webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - name: Export high-quality WebP copies; preserve original PNG artwork
        run: |
          set -euo pipefail
          for file in public/assets/nfts/*.png; do
            cwebp -quiet -q 88 -m 6 -resize 960 960 "$file" -o "${file%.png}.webp"
            test -s "${file%.png}.webp"
            ls -lh "$file" "${file%.png}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          original_names = [path.stem for path in Path('public/assets/nfts').glob('*.png')]
          for path in Path('src').rglob('*'):
              if path.suffix not in ('.ts', '.tsx'):
                  continue
              source = path.read_text(encoding='utf-8')
              updated = source
              for name in original_names:
                  updated = updated.replace(f'/assets/nfts/{name}.png', f'/assets/nfts/{name}.webp')
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  print('Optimized references in:', path)
          PY
      - name: Validate assets and build from a clean install
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit the optimized copies and their references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/nfts/*.webp src
          if ! git diff --cached --quiet; then
            git commit -m 'perf(assets): serve lighter WebP copies of original NFT art'
            git push origin HEAD:feat/figma-kurio-ui
          fi
