name: Bootstrap Playwright dependency
on:
  push:
    branches: [feat/figma-kurio-ui]
    paths:
      - .github/workflows/bootstrap-playwright.yml
permissions:
  contents: write
jobs:
  install-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright with lockfile
        run: |
          npm install --save-dev @playwright/test
          npm pkg set 'scripts.test:e2e=playwright test'
          npm pkg set 'scripts.test:e2e:report=playwright show-report'
      - name: Commit only the audited dependency changes to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(e2e): lock Playwright test runner and scripts'
            git push origin HEAD:feat/figma-kurio-ui
          fi
